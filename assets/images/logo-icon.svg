<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bagG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7EEDB0"/>
      <stop offset="100%" stop-color="#16A36A"/>
    </linearGradient>
    <linearGradient id="lensG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AAFFCC"/>
      <stop offset="60%" stop-color="#16A36A"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="4" flood-color="#16A36A" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDFFED"/>
      <stop offset="100%" stop-color="#C8FFD4"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="120" height="120" rx="26" fill="url(#bgG)"/>
  
  <g filter="url(#sh)">
    <!-- Briefcase body -->
    <rect x="14" y="40" width="64" height="52" rx="11" fill="url(#bagG)"/>
    <!-- Handle -->
    <path d="M28 40 C28 29 64 29 64 40" stroke="url(#bagG)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Clasp -->
    <rect x="37" y="60" width="14" height="10" rx="3" fill="white" opacity="0.9"/>
    <!-- Highlight -->
    <rect x="20" y="48" width="9" height="32" rx="3" fill="white" opacity="0.15"/>
    <!-- Magnifying glass -->
    <circle cx="68" cy="68" r="22" fill="url(#lensG)" stroke="white" stroke-width="3"/>
    <circle cx="68" cy="68" r="17" fill="white" opacity="0.12"/>
    <!-- Person in lens -->
    <circle cx="68" cy="63" r="5.5" fill="white"/>
    <path d="M57 80 C57 73 79 73 79 80" fill="white"/>
    <!-- Handle -->
    <line x1="85" y1="84" x2="97" y2="97" stroke="white" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Sparkles -->
    <circle cx="8" cy="34" r="3" fill="#99FF99"/>
    <circle cx="20" cy="22" r="3.5" fill="#16A36A" opacity="0.7"/>
    <circle cx="34" cy="16" r="2.5" fill="#99FF99" opacity="0.8"/>
  </g>
  <!-- Paper plane -->
  <g transform="translate(80,16) rotate(-25)">
    <polygon points="0,0 18,6 0,12" fill="#99FF99" opacity="0.9"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bgFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7EEDB0"/>
      <stop offset="100%" stop-color="#16A36A"/>
    </linearGradient>
    <filter id="shFav">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#0B4D30" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Rounded square background (favicon style) -->
  <rect width="120" height="120" rx="26" fill="url(#bgFav)"/>
  
  <g filter="url(#shFav)">
    <!-- Briefcase body -->
    <rect x="14" y="40" width="64" height="52" rx="11" fill="white" opacity="0.95"/>
    <!-- Handle -->
    <path d="M28 40 C28 29 64 29 64 40" stroke="white" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Clasp -->
    <rect x="37" y="60" width="14" height="10" rx="3" fill="#16A36A"/>
    <!-- Magnifying glass -->
    <circle cx="68" cy="68" r="22" fill="white" stroke="#7EEDB0" stroke-width="3"/>
    <!-- Person in lens -->
    <circle cx="68" cy="63" r="5.5" fill="#16A36A"/>
    <path d="M57 80 C57 73 79 73 79 80" fill="#16A36A"/>
    <!-- Handle -->
    <line x1="85" y1="84" x2="97" y2="97" stroke="white" stroke-width="5.5" stroke-linecap="round"/>
  </g>
  <!-- Paper plane -->
  <g transform="translate(82,16) rotate(-25)">
    <polygon points="0,0 18,6 0,12" fill="white" opacity="0.85"/>
  </g>
</svg>

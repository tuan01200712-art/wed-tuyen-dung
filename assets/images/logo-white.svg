<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" fill="none">
  <defs>
    <linearGradient id="bagW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.9)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.6)"/>
    </linearGradient>
    <linearGradient id="lensW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.95)"/>
      <stop offset="100%" stop-color="rgba(200,255,220,0.8)"/>
    </linearGradient>
  </defs>
  <!-- Briefcase body -->
  <rect x="12" y="52" width="88" height="68" rx="14" fill="url(#bagW)"/>
  <!-- Handle -->
  <path d="M36 52 C36 38 76 38 76 52" stroke="white" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Clasp -->
  <rect x="47" y="78" width="18" height="12" rx="4" fill="rgba(0,80,40,0.4)"/>
  <!-- Magnifying glass -->
  <circle cx="72" cy="88" r="26" fill="url(#lensW)" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>
  <!-- Person in lens -->
  <circle cx="72" cy="83" r="6" fill="rgba(22,163,106,0.9)"/>
  <path d="M60 103 C60 95 84 95 84 103" fill="rgba(22,163,106,0.9)"/>
  <!-- Handle -->
  <line x1="92" y1="108" x2="106" y2="122" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <!-- Sparkles -->
  <circle cx="8" cy="46" r="3" fill="rgba(255,255,255,0.7)"/>
  <circle cx="22" cy="34" r="4" fill="white" opacity="0.5"/>
  <circle cx="38" cy="28" r="2.5" fill="white" opacity="0.6"/>
  <!-- Paper plane -->
  <g transform="translate(93,24) rotate(-25)">
    <polygon points="0,0 22,8 0,16" fill="white" opacity="0.8"/>
  </g>
  <!-- Swish -->
  <path d="M 20 128 Q 56 142 100 132 Q 150 120 185 100" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Wordmark white -->
  <text x="128" y="108" font-family="'Plus Jakarta Sans','Inter',Arial,sans-serif" font-size="62" font-weight="800" fill="white" letter-spacing="-2">Job</text>
  <text x="244" y="108" font-family="'Plus Jakarta Sans','Inter',Arial,sans-serif" font-size="62" font-weight="800" fill="rgba(200,255,220,0.95)" letter-spacing="-2">Finder</text>
  <!-- Slogan -->
  <text x="130" y="132" font-family="'Plus Jakarta Sans','Inter',Arial,sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.75)" letter-spacing="0.5">Tìm việc dễ dàng  •  Kết nối tương lai</text>
</svg>

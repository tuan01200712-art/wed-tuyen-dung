<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 104" fill="none" width="100%" height="100%">
  <rect x="4" y="4" width="104" height="96" rx="22" fill="#FFFFFF" stroke="#B6F8CE" stroke-width="3"/>
  <g transform="translate(3, 4)">

  <defs>
    <linearGradient id="jfi-bag" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#8CFFBA"/>
      <stop offset="50%" stop-color="#45E88D"/>
      <stop offset="100%" stop-color="#10B96C"/>
    </linearGradient>
    <linearGradient id="jfi-flap" x1="20%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#B8FFD5" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="jfi-swoosh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EFFAE"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="jfi-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#067D51"/>
      <stop offset="100%" stop-color="#046842"/>
    </linearGradient>
    <radialGradient id="jfi-lens" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAFFF2"/>
    </radialGradient>
    <linearGradient id="jfi-person" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#046842"/>
      <stop offset="100%" stop-color="#29D67D"/>
    </linearGradient>
    <clipPath id="jfi-lens-clip">
      <circle cx="71" cy="56" r="17.5"/>
    </clipPath>
    <filter id="jfi-bag-shadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#057A55" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Curved Mint Swoosh under briefcase -->
  <path d="M 11 50 C 7 75, 36 89, 68 77 C 40 82, 16 70, 11 50 Z" fill="url(#jfi-swoosh)"/>

  <!-- Tilted Green Briefcase -->
  <g transform="translate(46, 46) rotate(-13)" filter="url(#jfi-bag-shadow)">
    <!-- Handle -->
    <path d="M -11 -18 L -11 -22.5 C -11 -28.5, 11 -28.5, 11 -22.5 L 11 -18"
          stroke="#057A55" stroke-width="6.2" stroke-linecap="round" fill="none"/>
    <path d="M -11 -18 L -11 -22.5 C -11 -27.5, 11 -27.5, 11 -22.5 L 11 -18"
          stroke="#48E592" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Briefcase Main Body -->
    <rect x="-29" y="-18" width="58" height="43" rx="11" fill="url(#jfi-bag)"/>

    <!-- Glossy Top Flap -->
    <path d="M -29 -7 C -29 -14.5, -24 -18, -18 -18 L 18 -18 C 24 -18, 29 -14.5, 29 -7 L 29 -3 Q 0 5 -29 -3 Z"
          fill="url(#jfi-flap)"/>

    <!-- Clasp Buckle (Left Flap) -->
    <rect x="-21" y="-4" width="11" height="10.5" rx="3" fill="#0B8B5A" stroke="#E8FFF1" stroke-width="2.2"/>
  </g>

  <!-- Two Playful Sparkle Motion Rays (top-right of briefcase) -->
  <line x1="79" y1="21" x2="84.5" y2="10.5" stroke="#4CE88E" stroke-width="4.4" stroke-linecap="round"/>
  <line x1="89" y1="29" x2="99" y2="23.5" stroke="#78FAAD" stroke-width="4" stroke-linecap="round"/>

  <!-- White/Bg Separation Halo behind Magnifying Glass -->
  <circle cx="71" cy="56" r="22.5" fill="#FFFFFF"/>
  <line x1="85.5" y1="70.5" x2="98" y2="83.5" stroke="#FFFFFF" stroke-width="12.5" stroke-linecap="round"/>

  <!-- Lens Interior -->
  <circle cx="71" cy="56" r="17.5" fill="url(#jfi-lens)"/>

  <!-- Person Silhouette inside Lens -->
  <g clip-path="url(#jfi-lens-clip)">
    <circle cx="71" cy="49.5" r="5.6" fill="url(#jfi-person)"/>
    <path d="M 58.5 72.5 C 58.5 60.5, 83.5 60.5, 83.5 72.5 Z" fill="url(#jfi-person)"/>
  </g>

  <!-- Magnifying Glass Ring & Handle -->
  <circle cx="71" cy="56" r="19" fill="none" stroke="url(#jfi-ring)" stroke-width="5.6"/>
  <line x1="86" y1="71" x2="97.5" y2="83" stroke="#046842" stroke-width="7.2" stroke-linecap="round"/>

  </g>
</svg>